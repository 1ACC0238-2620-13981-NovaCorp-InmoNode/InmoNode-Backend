# Test profile: the datasource comes from Testcontainers (@ServiceConnection), so none is declared here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Schema migrations only; tests create the accounts they need.
spring.flyway.locations=classpath:db/migration

# Test-only JWT secret.
authorization.jwt.secret=test-only-secret-test-only-secret-test-only

# No SMTP server in tests: tests that register users mock VerificationEmailSender.
spring.mail.host=localhost
spring.mail.port=1025

authorization.verification.url=http://localhost:5173/verify-email
# Tests release expired lot blocks by calling the command directly, never on a timer.
financial.lot-blocks.release-job.enabled=false

# No cooldown, so integration tests can resend right after registering; unit tests cover the cooldown.
authorization.verification.resend-cooldown-seconds=0
authorization.cors.allowed-origins=http://localhost:5173
