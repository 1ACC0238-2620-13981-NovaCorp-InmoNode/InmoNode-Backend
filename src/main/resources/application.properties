# Spring Application Name
spring.application.name=InmoNode-Backend

# Local environment variables (DATABASE_PASSWORD, etc.); ignored when the file is absent.
spring.config.import=optional:file:.env[.properties]

# Default to development when no explicit profile is provided.
spring.profiles.default=dev

# GZIP for large JSON responses such as the field portfolio and lot maps (US-39): saves the agents' mobile data.
server.compression.enabled=true
server.compression.mime-types=application/json,application/geo+json
server.compression.min-response-size=10KB

# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.novacorp.inmonode.inmonodebackend.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Flyway Configuration
# One schema per bounded context; migrations live in db/migration/<schema>.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=identity_access,catalog_management,quoting_reservation,financial_document_control,voucher_management
# Each context numbers its migrations with its position in the list above as major version
# (identity_access V1_x, financial_document_control V4_x). Out-of-order lets a context add a migration
# after another context's higher version was applied; safe because no migration crosses schemas.
spring.flyway.out-of-order=true

# Application Information for Documentation
# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Use messages.properties (English) as default instead of the JVM locale.
spring.messages.fallback-to-system-locale=false

# JWT (IAM). The secret must be at least 32 bytes; supply it via JWT_SECRET outside development.
authorization.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
# Lifetime of the single-use refresh tokens that renew the JWT (mainly for the mobile app).
authorization.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:30}

# Sender address of outgoing emails. The SMTP server itself is configured per profile.
authorization.mail.from=${MAIL_FROM:no-reply@inmonode.dev}

# Web portal page that receives ?token=... from the verification email and posts it to /api/v1/auth/verify-email.
authorization.verification.url=${VERIFICATION_URL:http://localhost:5173/verify-email}
# Minimum wait between verification emails to the same address (POST /api/v1/auth/resend-verification).
authorization.verification.resend-cooldown-seconds=${VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
# How long a verification link works after it is emailed.
authorization.verification.token-expiration-hours=${VERIFICATION_TOKEN_EXPIRATION_HOURS:24}

# Lot Block: how often expired blocks are released so the lot shows as available again.
financial.lot-blocks.release-job.enabled=true
financial.lot-blocks.release-interval=PT1M

# Web portal origins allowed by CORS (comma-separated).
authorization.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# File repository for vouchers (US-33). Defaults: the local S3-compatible server of docker compose (RustFS).
# The backend reaches it at STORAGE_S3_ENDPOINT; presigned URLs carry STORAGE_S3_PUBLIC_ENDPOINT, reachable by clients.
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://localhost:9000}
storage.s3.public-endpoint=${STORAGE_S3_PUBLIC_ENDPOINT:http://localhost:9000}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}
storage.s3.bucket=${STORAGE_S3_BUCKET:inmonode-vouchers}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:inmonode-dev}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:inmonode-dev-secret}
storage.s3.path-style-access=${STORAGE_S3_PATH_STYLE_ACCESS:true}
storage.s3.create-bucket=${STORAGE_S3_CREATE_BUCKET:true}
