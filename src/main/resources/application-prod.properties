# Production profile
# Read database settings from environment variables expected in Docker/runtime.
spring.datasource.url=jdbc:postgresql://${DATABASE_URL}:${DATABASE_PORT:5432}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# Production-lean JPA behavior
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# App port
server.port=${PORT:8080}

# Schema migrations plus the initial staff accounts (identity_access), whose credentials are required.
# Hashes are BCrypt; see .env.example for how to generate one.
spring.flyway.locations=classpath:db/migration,classpath:db/seed-prod/identity_access
spring.flyway.placeholders.staff_field_agent_email=${STAFF_FIELD_AGENT_EMAIL}
spring.flyway.placeholders.staff_field_agent_password_hash=${STAFF_FIELD_AGENT_PASSWORD_HASH}
spring.flyway.placeholders.staff_catalog_admin_email=${STAFF_CATALOG_ADMIN_EMAIL}
spring.flyway.placeholders.staff_catalog_admin_password_hash=${STAFF_CATALOG_ADMIN_PASSWORD_HASH}
spring.flyway.placeholders.staff_finance_admin_email=${STAFF_FINANCE_ADMIN_EMAIL}
spring.flyway.placeholders.staff_finance_admin_password_hash=${STAFF_FINANCE_ADMIN_PASSWORD_HASH}

# JWT (IAM): required, at least 32 bytes.
authorization.jwt.secret=${JWT_SECRET}

# Outgoing email over SMTP (Brevo: smtp-relay.brevo.com:587 with an SMTP key).
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Verification page of the deployed web portal (required).
authorization.verification.url=${VERIFICATION_URL}

# Deployed web portal origins (required, comma-separated).
authorization.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
