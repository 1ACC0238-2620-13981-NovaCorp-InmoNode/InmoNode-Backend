# Development profile
# Use Dockerfile-compatible environment variable names with local defaults.
spring.datasource.url=jdbc:postgresql://${DATABASE_URL:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:inmonode}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Developer-friendly JPA behavior
# Schema changes are owned by Flyway; Hibernate only validates the mapping.
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

# App port
server.port=${PORT:8080}

# Development-only JWT secret and seed users (identity_access). Never use these values outside dev.
authorization.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
spring.flyway.locations=classpath:db/migration,classpath:db/seed/identity_access

# Outgoing email goes to Mailpit (docker compose up inmonode-mail); inbox at http://localhost:8025.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
