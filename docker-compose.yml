services:
  inmonode-db:
    image: postgres:18
    container_name: inmonode-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-inmonode}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - "${DATABASE_HOST_PORT:-5433}:5432"
    volumes:
      - inmonode-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  inmonode-storage:
    # Local S3-compatible file repository for vouchers (AWS S3 in production). RustFS, because MinIO no longer
    # publishes its images. API on 9000, web console on 9001.
    image: rustfs/rustfs:1.0.0
    container_name: inmonode-storage
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-inmonode-dev}
      RUSTFS_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-inmonode-dev-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${STORAGE_HOST_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - inmonode-storage-data:/data

  inmonode-mail:
    # Local SMTP server: catches every outgoing email. Web inbox at http://localhost:8025.
    image: axllent/mailpit:v1.31.3
    container_name: inmonode-mail
    ports:
      - "${MAIL_HOST_PORT:-1025}:1025"
      - "${MAIL_WEB_PORT:-8025}:8025"

  inmonode-broker:
    # Local message broker of the background PDFs (US-45; CloudAMQP in production). Management UI at
    # http://localhost:15672. RabbitMQ only lets 'guest' in from its own host, hence a user of its own.
    image: rabbitmq:4.1-management-alpine
    container_name: inmonode-broker
    environment:
      RABBITMQ_DEFAULT_USER: ${BROKER_USER:-inmonode-dev}
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD:-inmonode-dev-secret}
    ports:
      - "${BROKER_HOST_PORT:-5672}:5672"
      - "${BROKER_CONSOLE_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  inmonode-backend:
    image: inmonode-backend:0.0.1
    container_name: inmonode-backend
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      inmonode-db:
        condition: service_healthy
      inmonode-mail:
        condition: service_started
      inmonode-storage:
        condition: service_started
      inmonode-broker:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: inmonode-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-inmonode}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      PORT: 8080
      # The 'prod' profile refuses to start without a JWT secret of at least 32 bytes.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required; set it in .env}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      REFRESH_TOKEN_EXPIRATION_DAYS: ${REFRESH_TOKEN_EXPIRATION_DAYS:-30}
      # Mailpit needs neither authentication nor TLS; Brevo (production) needs both.
      MAIL_HOST: inmonode-mail
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      MAIL_FROM: ${MAIL_FROM:-no-reply@inmonode.dev}
      VERIFICATION_URL: ${VERIFICATION_URL:-http://localhost:5173/verify-email}
      VERIFICATION_RESEND_COOLDOWN_SECONDS: ${VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      VERIFICATION_TOKEN_EXPIRATION_HOURS: ${VERIFICATION_TOKEN_EXPIRATION_HOURS:-24}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:5173/reset-password}
      PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS: ${PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:-60}
      PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:-30}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:[*]}"
      INSTALLMENT_REVIEW_CRON: ${INSTALLMENT_REVIEW_CRON:-0 0 8 * * *}
      # Initial staff accounts, created by the first startup on an empty database (see .env.example).
      STAFF_FIELD_AGENT_EMAIL: ${STAFF_FIELD_AGENT_EMAIL:?STAFF_FIELD_AGENT_EMAIL is required; set it in .env}
      STAFF_FIELD_AGENT_PASSWORD_HASH: ${STAFF_FIELD_AGENT_PASSWORD_HASH:?STAFF_FIELD_AGENT_PASSWORD_HASH is required; set it in .env}
      STAFF_CATALOG_ADMIN_EMAIL: ${STAFF_CATALOG_ADMIN_EMAIL:?STAFF_CATALOG_ADMIN_EMAIL is required; set it in .env}
      STAFF_CATALOG_ADMIN_PASSWORD_HASH: ${STAFF_CATALOG_ADMIN_PASSWORD_HASH:?STAFF_CATALOG_ADMIN_PASSWORD_HASH is required; set it in .env}
      STAFF_FINANCE_ADMIN_EMAIL: ${STAFF_FINANCE_ADMIN_EMAIL:?STAFF_FINANCE_ADMIN_EMAIL is required; set it in .env}
      STAFF_FINANCE_ADMIN_PASSWORD_HASH: ${STAFF_FINANCE_ADMIN_PASSWORD_HASH:?STAFF_FINANCE_ADMIN_PASSWORD_HASH is required; set it in .env}
      # The backend reaches the storage inside the network; presigned URLs must use an address clients can reach.
      STORAGE_S3_ENDPOINT: http://inmonode-storage:9000
      STORAGE_S3_PUBLIC_ENDPOINT: ${STORAGE_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-inmonode-vouchers}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-inmonode-dev}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-inmonode-dev-secret}
      STORAGE_S3_PATH_STYLE_ACCESS: "true"
      STORAGE_S3_CREATE_BUCKET: "true"
      # US-45: PDF requests go through the broker; the consumer aborts a rendering after this long.
      CLOUDAMQP_URL: amqp://${BROKER_USER:-inmonode-dev}:${BROKER_PASSWORD:-inmonode-dev-secret}@inmonode-broker:5672
      DOCUMENT_RENDER_TIMEOUT: ${DOCUMENT_RENDER_TIMEOUT:-PT30S}
      # US-55: Stripe in test mode; without the keys, starting a payment answers 503 PAYMENTS_UNAVAILABLE.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYMENT_INTENT_TTL: ${PAYMENT_INTENT_TTL:-PT30M}
      # US-56: contracts signed through DocuSeal; without these, issued contracts wait to be sent to signature.
      # With the "signature" profile, DOCUSEAL_URL is http://inmonode-signature:3000 and the public one
      # http://localhost:3000.
      DOCUSEAL_URL: ${DOCUSEAL_URL:-}
      DOCUSEAL_PUBLIC_URL: ${DOCUSEAL_PUBLIC_URL:-}
      DOCUSEAL_API_TOKEN: ${DOCUSEAL_API_TOKEN:-}
      DOCUSEAL_WEBHOOK_SECRET: ${DOCUSEAL_WEBHOOK_SECRET:-}
      DOCUSEAL_TEMPLATE_ID: ${DOCUSEAL_TEMPLATE_ID:-}

  # US-56: the self-hosted DocuSeal, only with `docker compose --profile signature up`. Its first start asks for an
  # admin account at http://localhost:3000; then upload the signature sheet template and add the webhook there.
  inmonode-signature:
    image: docuseal/docuseal:3.3.5
    container_name: inmonode-signature
    profiles: ["signature"]
    environment:
      HOST: localhost:3000
    ports:
      - "${SIGNATURE_HOST_PORT:-3000}:3000"
    volumes:
      - inmonode-signature-data:/data

volumes:
  inmonode-db-data:
  inmonode-storage-data:
  inmonode-signature-data:
