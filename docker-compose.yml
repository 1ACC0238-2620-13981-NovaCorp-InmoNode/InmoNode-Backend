services:
  inmonode-db:
    image: postgres:18
    container_name: inmonode-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-inmonode}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - "${DATABASE_HOST_PORT:-5433}:5432"
    volumes:
      - inmonode-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  inmonode-mail:
    # Local SMTP server: catches every outgoing email. Web inbox at http://localhost:8025.
    image: axllent/mailpit:v1.31.3
    container_name: inmonode-mail
    ports:
      - "${MAIL_HOST_PORT:-1025}:1025"
      - "${MAIL_WEB_PORT:-8025}:8025"

  inmonode-backend:
    image: inmonode-backend:0.0.1
    container_name: inmonode-backend
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      inmonode-db:
        condition: service_healthy
      inmonode-mail:
        condition: service_started
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: inmonode-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-inmonode}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      PORT: 8080
      # The 'prod' profile refuses to start without a JWT secret of at least 32 bytes.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required; set it in .env}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      REFRESH_TOKEN_EXPIRATION_DAYS: ${REFRESH_TOKEN_EXPIRATION_DAYS:-30}
      # Mailpit needs neither authentication nor TLS; Brevo (production) needs both.
      MAIL_HOST: inmonode-mail
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      MAIL_FROM: ${MAIL_FROM:-no-reply@inmonode.dev}
      VERIFICATION_URL: ${VERIFICATION_URL:-http://localhost:5173/verify-email}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Initial staff accounts, created by the first startup on an empty database (see .env.example).
      STAFF_FIELD_AGENT_EMAIL: ${STAFF_FIELD_AGENT_EMAIL:?STAFF_FIELD_AGENT_EMAIL is required; set it in .env}
      STAFF_FIELD_AGENT_PASSWORD_HASH: ${STAFF_FIELD_AGENT_PASSWORD_HASH:?STAFF_FIELD_AGENT_PASSWORD_HASH is required; set it in .env}
      STAFF_CATALOG_ADMIN_EMAIL: ${STAFF_CATALOG_ADMIN_EMAIL:?STAFF_CATALOG_ADMIN_EMAIL is required; set it in .env}
      STAFF_CATALOG_ADMIN_PASSWORD_HASH: ${STAFF_CATALOG_ADMIN_PASSWORD_HASH:?STAFF_CATALOG_ADMIN_PASSWORD_HASH is required; set it in .env}
      STAFF_FINANCE_ADMIN_EMAIL: ${STAFF_FINANCE_ADMIN_EMAIL:?STAFF_FINANCE_ADMIN_EMAIL is required; set it in .env}
      STAFF_FINANCE_ADMIN_PASSWORD_HASH: ${STAFF_FINANCE_ADMIN_PASSWORD_HASH:?STAFF_FINANCE_ADMIN_PASSWORD_HASH is required; set it in .env}

volumes:
  inmonode-db-data:
